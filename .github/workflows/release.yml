name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: make test

      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" make build

      - name: Package
        run: scripts/package-release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          flags="--generate-notes"
          case "$version" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "build/LidAwake-$version.zip" \
            "build/LidAwake-$version.zip.sha256" \
            --title "$GITHUB_REF_NAME" $flags

      - name: Check out Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/checkout@v4
        with:
          repository: kokush-v/homebrew-utils
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Update Homebrew cask
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha="$(cut -d ' ' -f 1 "build/LidAwake-$version.zip.sha256")"
          cask="tap/Casks/lidawake.rb"
          sed -i '' -E "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" "$cask"
          cd tap
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump lidawake to $version"
          git push
